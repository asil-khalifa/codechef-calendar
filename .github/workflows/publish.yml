name: Publish contest feeds

on:
  schedule:
    # Hourly. GitHub's scheduler is best-effort and can run late under load,
    # which is fine -- contests are announced days ahead, not minutes.
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "make_ics.py"
      - "check_feeds.py"
      - "feeds.json"
      - ".github/workflows/publish.yml"

# Never let two runs race to commit the same files.
concurrency:
  group: publish-feeds
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Generate first, publish second, and only then judge third-party feeds.
      # A dead Codeforces or LeetCode calendar must not block publishing our
      # own CodeChef feeds.
      - name: Generate feeds
        run: python make_ics.py --out docs

      - name: Check feed health
        id: health
        continue-on-error: true
        run: python check_feeds.py --out docs --strict

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first -- git diff ignores untracked files, so a new file in
          # docs/ would look like "no change" and never be published.
          git add docs
          if git diff --cached --quiet -- docs; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Update contest feeds"
          # The Raspberry Pi publishes on the same schedule, so a push here can
          # lose a race. Rebase onto whatever it pushed and retry.
          for attempt in 1 2 3; do
            if git pull --rebase -q origin main && git push -q; then
              exit 0
            fi
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          echo "::error::could not push after 3 attempts"
          exit 1

      # Surfaced last so the run still publishes, but a stale recommendation
      # turns the run red and GitHub emails about it. The entire point of this
      # project is that dead feeds should not fail silently -- including ours.
      - name: Fail if a recommended feed is stale
        if: steps.health.outcome == 'failure'
        run: |
          echo "::error::A feed recommended on the website is stale or dead. See the health check output above and update feeds.json."
          exit 1
